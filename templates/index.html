{% extends "layout.html" %}

{% block main %}
<div class="row mb-4">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Add New Task</h3>
            <form action="/add" method="post" class="row g-3">
                <div class="col-md-6">
                    <input type="text" name="title" class="form-control" placeholder="Task title..." required autofocus>
                </div>
                <div class="col-md-3">
                    <input type="text" name="category" class="form-control" placeholder="Category (e.g., Work)">
                </div>
                <div class="col-md-3">
                    <select name="priority" class="form-select">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">Add Task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <h4 class="mb-3">Your Tasks</h4>
        {% if tasks %}
            <div class="list-group shadow-sm">
                {% for task in tasks %}
                    <div class="list-group-item d-flex justify-content-between align-items-center {% if task.status == 'Completed' %}bg-light text-muted{% endif %}">
                        <div>
                            <span class="{% if task.status == 'Completed' %}text-decoration-line-through{% endif %} fw-semibold">
                                {{ task.title }}
                            </span>
                            <div class="mt-1">
                                <span class="badge bg-secondary">{{ task.category }}</span>
                                <span class="badge {% if task.priority == 'High' %}bg-danger{% elif task.priority == 'Medium' %}bg-warning text-dark{% else %}bg-info{% endif %}">
                                    {{ task.priority }}
                                </span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <form action="/toggle/{{ task.id }}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm {% if task.status == 'Completed' %}btn-outline-secondary{% else %}btn-success{% endif %}">
                                    {% if task.status == 'Completed' %}Undo{% else %}Complete{% endif %}
                                </button>
                            </form>
                            <form action="/delete/{{ task.id }}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center text-muted">No tasks added yet. Start by adding one above!</p>
        {% endif %}
    </div>
</div>
{% endblock %}
